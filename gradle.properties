org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- FieldStamp release configuration ---
# Play Console in-app product ID for the one-time "FieldStamp Pro" unlock.
# The product must be created in Play Console with exactly this ID before purchases can work.
fieldstamp.proProductId=fieldstamp_pro
# Optional: Base64 RSA public key from Play Console > Monetization setup > Licensing.
# When set, purchase signatures are verified on-device. Supply via ~/.gradle/gradle.properties, not here.
fieldstamp.playLicenseKey=
